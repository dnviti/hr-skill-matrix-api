apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hr-skill-matrix.fullname" . }}-app-deployment
  labels:
    app: skill-matrix-app
  {{- include "hr-skill-matrix.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.appDeployment.replicas }}
  selector:
    matchLabels:
      app: skill-matrix-app
    {{- include "hr-skill-matrix.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: skill-matrix-app
      {{- include "hr-skill-matrix.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - env:
        # Configurazione database
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "hr-skill-matrix.fullname" . }}-db-credentials
              key: DATABASE_URL
        
        # Configurazione ambiente applicazione
        - name: APP_ENV
          value: {{ .Values.appDeployment.skillMatrixApp.env.APP_ENV | quote }}
        
        # Configurazione autenticazione OIDC
        - name: OIDC_ENABLED
          value: {{ .Values.auth.enabled | quote }}
        {{- if .Values.auth.enabled }}
        - name: OIDC_ISSUER
          value: {{ .Values.auth.oidc.issuer | quote }}
        - name: OIDC_CLIENT_ID
          value: {{ .Values.auth.oidc.clientId | quote }}
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "hr-skill-matrix.fullname" . }}-auth-credentials
              key: OIDC_CLIENT_SECRET
        - name: OIDC_REDIRECT_URI
          value: {{ .Values.auth.oidc.redirectUri | quote }}
        - name: JWT_ALGORITHM
          value: {{ .Values.auth.oidc.jwt.algorithm | quote }}
        {{- if .Values.auth.oidc.jwt.audience }}
        - name: JWT_AUDIENCE
          value: {{ .Values.auth.oidc.jwt.audience | quote }}
        {{- else }}
        - name: JWT_AUDIENCE
          value: {{ .Values.auth.oidc.clientId | quote }}
        {{- end }}
        {{- end }}
        
        # Configurazione CORS
        {{- if .Values.cors.origins }}
        - name: CORS_ORIGINS
          value: {{ join "," .Values.cors.origins | quote }}
        {{- end }}
        image: {{ .Values.appDeployment.skillMatrixApp.image.repository }}:{{ .Values.appDeployment.skillMatrixApp.image.tag
          | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.appDeployment.skillMatrixApp.imagePullPolicy }}
        name: skill-matrix-app
        ports:
        - containerPort: 8000
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        resources: {{- toYaml .Values.appDeployment.skillMatrixApp.resources | nindent
          10 }}
      initContainers:
      - name: wait-for-mariadb
        image: {{ .Values.appDeployment.waitForMariadb.image.repository }}:{{ .Values.appDeployment.waitForMariadb.image.tag | default .Chart.AppVersion }}
        command:
        - sh
        - -c
        - |
          echo "Waiting for MariaDB at {{ .Release.Name }}-mariadb:3306..."
          until nc -z {{ .Release.Name }}-mariadb 3306; do
            echo "MariaDB not ready yet, sleeping..."
            sleep 2
          done
          echo "MariaDB is up!"
        resources: {}
